name: Verify 4Running

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Unit and account regressions
        run: npm test
      - name: Mobile journey
        run: npm run test:browser
      - name: Session save regression
        run: node tests/save-session-smoke.mjs
      - name: Timer recovery and service worker regressions
        run: node tests/runtime-browser-regressions.mjs
      - name: Multi-tab and offline synchronization regressions
        run: node tests/sync-regressions.mjs
      - name: Whitespace checks
        run: git diff --check
